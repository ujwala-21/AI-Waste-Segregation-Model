<!DOCTYPE html>
<html>
<body>

<input type="file" id="file">

<script>

document.getElementById("file").addEventListener("change", async function(e){

    alert("File Selected");

    try{

        const file = e.target.files[0];

        const response = await fetch(
            "https://detect.roboflow.com/waste-object-detection-d5vk5/4?api_key=YOUR_API_KEY",
            {
                method: "POST",
                body: file
            }
        );

        const result = await response.json();

        console.log(result);
        alert(JSON.stringify(result));

    }

    catch(error){

        console.error(error);
        alert("ERROR: " + error);

    }

});

</script>

</body>
</html>
